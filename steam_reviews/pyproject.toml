[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-reviews-local"
version = "1.3.0"
description = "Local CS2 English review collection, preprocessing and read API"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "langdetect==1.0.9", "simplemma==2.0.0"]

[tool.setuptools.packages.find]
include = ["cs2_reviews*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
